name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap checks first, so an obvious mistake fails in seconds rather than
  # after a full toolchain build.
  static:
    name: Linux / layering + format
    runs-on: [self-hosted, Linux]
    # The runner's host is Void Linux, which actions/setup-python has no
    # prebuilt CPython for -- it fails with "version '3.12' ... not found for
    # VoidLinux rolling" before any step runs. Every job also sudo apt-get
    # installs its dependencies, which is throwaway on a hosted VM and repeated
    # mutation of a workstation on a self-hosted one. Running inside the image
    # answers both, and setup-python is dropped because the image pins 3.12.
    container:
      # A registry on the runner's own host, NOT a local image tag: the runner
      # runs `docker pull` before creating the container and fails the job if it
      # cannot, even when the image is already present. localhost:5000 keeps
      # this self-contained -- no registry credentials to expire, no network,
      # and the pull is a loopback copy. Rebuild with scripts/ci_image.sh.
      image: localhost:5000/vkml-ci:latest
    steps:
      - uses: actions/checkout@v5

      - name: Layer dependency check
        # Enforces docs/ARCHITECTURE.md 4.1. This has already caught one real
        # violation (autograd reaching into api), so it is not ceremonial.
        run: python scripts/check_layering.py

      # PINNED, and not from apt. `apt-get install clang-format` gives whatever
      # the runner image ships that week -- clang-format 18 on noble today --
      # while a contributor has whatever their distro ships. The two disagree,
      # so this gate failed on code that was correctly formatted locally, and it
      # would equally have started failing on UNCHANGED code the day the runner
      # image bumped. A gate whose verdict depends on the date is not a gate.
      #
      # The PyPI package is the same binary on every platform, so `pip install
      # clang-format==18.1.8` reproduces this exactly on Linux, macOS and
      # Windows. Keep the version here and in CONTRIBUTING.md in step.
      - name: clang-format
        run: |
          python -m pip install --quiet clang-format==18.1.8
          find include src tests/cpp bench/cpp bindings -name '*.h' -o -name '*.cpp' \
            | xargs clang-format --dry-run --Werror

  cpp:
    name: Linux / C++ (${{ matrix.preset }})
    runs-on: [self-hosted, Linux]
    container:
      image: localhost:5000/vkml-ci:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: debug
            compiler: g++
          - preset: release
            compiler: g++
          - preset: asan
            compiler: clang++
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build clang
          # The asan preset pins clang because GCC's libasan is not always
          # packaged alongside the compiler.

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DVKML_BUILD_PYTHON=OFF -DVKML_WERROR=ON

      - name: Build
        run: cmake --build build/${{ matrix.preset }} -j$(nproc)

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  python:
    name: Linux / Python + PyTorch validation
    runs-on: [self-hosted, Linux]
    container:
      image: localhost:5000/vkml-ci:latest
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build

      - name: Install Python dependencies
        # CPU-only torch: the validation suite never needs a GPU, and the CUDA
        # wheels are an order of magnitude larger.
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest nanobind
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build extension
        run: |
          cmake --preset release -DVKML_BUILD_PYTHON=ON
          cmake --build build/release -j$(nproc)

      - name: Run validation suite
        # Coverage is recorded on the same run: it costs nothing measurable and
        # the gate below needs it.
        env:
          VKML_COVERAGE: coverage.tsv
        run: python -m pytest tests/python -q

      - name: Coverage gate
        # Fails when a path the suite used to exercise stops being exercised --
        # invisible in a green run, which is the whole point.
        #
        # The baseline is recorded WITHOUT a GPU, because this runner has none
        # and roughly a third of the strided and large-size coverage comes from
        # the Vulkan tests. The script refuses to compare across a different
        # backend set rather than reporting dozens of phantom gaps.
        run: python scripts/coverage_matrix.py coverage.tsv --check docs/coverage-baseline.json

      - name: Assert the suite is not silently empty
        # A misconfigured import path would make pytest collect nothing and
        # report success, which is the failure mode this guards against.
        run: |
          COUNT=$(python -m pytest tests/python --collect-only -q | tail -1 | grep -oE '^[0-9]+')
          echo "collected $COUNT tests"
          test "$COUNT" -ge 250

  wheel:
    name: Linux / Wheel builds and installs
    runs-on: [self-hosted, Linux]
    container:
      image: localhost:5000/vkml-ci:latest
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build libvulkan-dev glslang-tools

      - name: Build and install the wheel
        # Exercises a build path nothing else covers: scikit-build-core driving
        # CMake, the install() rule that puts the extension in the wheel, and
        # the version being read out of CMakeLists.txt rather than duplicated.
        run: pip install --verbose .

      - name: Import it from outside the source tree
        # From /tmp, so a passing import cannot be the source directory being
        # picked up instead of the installed package -- which is exactly how a
        # broken wheel looks like a working one.
        run: |
          cd /tmp
          python -c "
          import vkml, os
          assert 'site-packages' in vkml.__file__, vkml.__file__
          print('vkml', vkml.__version__, 'from', os.path.dirname(vkml.__file__))
          print('vulkan built in:', vkml.has_vulkan)
          assert vkml.has_vulkan, 'the wheel should carry the Vulkan backend'
          "

  second-driver:
    name: Linux / Vulkan suite on a second driver (lavapipe)
    runs-on: [self-hosted, Linux]
    container:
      image: localhost:5000/vkml-ci:latest
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain and a software Vulkan driver
        # mesa-vulkan-drivers ships lavapipe, which needs no GPU. That is the
        # point: the runner has none, and everything else here therefore skips
        # every Vulkan test.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build libvulkan-dev glslang-tools \
                                  mesa-vulkan-drivers vulkan-tools

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest nanobind
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build with the Vulkan backend
        run: |
          cmake --preset release -DVKML_VULKAN=ON -DVKML_BUILD_PYTHON=ON
          cmake --build build/release -j$(nproc)

      - name: Confirm a Vulkan device is visible
        run: vulkaninfo --summary | grep -i -E "deviceName|driverName"

      - name: Run the suite
        # A different DRIVER, which is where portability actually breaks --
        # subgroup 8 against RADV's 64, half the shared memory, and its own
        # SPIR-V compiler. Tests that model RADV's compiler skip themselves.
        run: python -m pytest tests/python -q

  python-asan:
    name: Linux / Python suite under AddressSanitizer
    runs-on: [self-hosted, Linux]
    container:
      image: localhost:5000/vkml-ci:latest
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        # clang for the sanitizer runtime, llvm for llvm-symbolizer -- without
        # the latter a report still fires but gives offsets instead of names.
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build clang llvm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest nanobind
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run the suite against an instrumented build
        # A separate job rather than a flag on the existing one: the sanitised
        # extension is ~20x larger and the suite takes ~4x as long, and it
        # overwrites python/vkml/, so it cannot share a workspace with the
        # ordinary Python job.
        #
        # This covers the CPU backend and everything above it. Vulkan is absent
        # by default and the runner has no GPU, so those tests skip -- stated
        # rather than implied, because "the suite passed under ASan" would
        # otherwise sound like it covered the shaders.
        run: python scripts/asan_python.py

  benchmark:
    name: Linux / Benchmark smoke run
    runs-on: [self-hosted, Linux]
    container:
      image: localhost:5000/vkml-ci:latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build

      - name: Build
        run: |
          cmake --preset relwithdebinfo -DVKML_BUILD_PYTHON=OFF
          cmake --build build/relwithdebinfo -j$(nproc)

      - name: Run
        # CI runners are too noisy for the numbers to gate a merge; this only
        # proves the harness still runs and every benchmark completes. Real
        # baselines are recorded in docs/BASELINE-CPU.md from a known machine.
        run: ./build/relwithdebinfo/bin/vkml_bench --json > bench-results.json

      - uses: actions/upload-artifact@v6
        with:
          name: bench-results
          path: bench-results.json
  # -------------------------------------------------------------------------
  # macOS / MoltenVK is NOT in this pipeline. It lives in macos-moltenvk.yml and
  # runs only when triggered by hand.
  #
  # Not deleted, and not because it is broken: it reached 1233 passing tests on
  # the runner. The one failure is unfixable there --
  # test_profiler_reports_nonzero_for_a_real_dispatch, on an "Apple Paravirtual
  # device" whose timestamps report valid bits and never advance -- and that test
  # deliberately does not skip, because skipping would blind it to the
  # resolve_timestamps() regression it was written for.
  #
  # So the job could only ever be red here, and a permanently red job trains
  # everyone to ignore the board. Moved rather than suppressed: every step in it,
  # including the ICD and validation-layer path discovery that took three
  # attempts to get right, is preserved verbatim and still runnable.
  #
  # Revisit when macOS is a platform vkML supports rather than probes.
  # -------------------------------------------------------------------------
  manylinux:
    name: Linux / redistributable wheel (manylinux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build a manylinux wheel
        # The ordinary wheel job builds a linux_x86_64 wheel, which PyPI
        # rejects. This one builds what could actually be published. All of the
        # configuration lives in pyproject.toml under [tool.cibuildwheel] and
        # was verified locally in the manylinux image first.
        #
        # One Python here rather than the declared four: the glslang source
        # build dominates, and a push does not need to prove all four when the
        # only difference is the interpreter. A release run drops the override.
        env:
          CIBW_BUILD: cp312-*
        run: pipx run cibuildwheel==4.1.1 --output-dir wheelhouse

      - name: Check the tag, and that no Vulkan loader was bundled
        # Two things make this wheel correct rather than merely present: a
        # manylinux tag PyPI will accept, and the ABSENCE of libvulkan.so.1
        # inside it. Bundling the loader would ship one frozen at build time
        # that cannot see the user's driver.
        run: |
          ls -la wheelhouse/
          for w in wheelhouse/*.whl; do
            case "$w" in
              *manylinux*) echo "ok: manylinux tag -- $(basename "$w")" ;;
              *) echo "::error::not a manylinux wheel: $(basename "$w")"; exit 1 ;;
            esac
            if python -m zipfile -l "$w" | grep -q "libvulkan"; then
              echo "::error::libvulkan is bundled inside the wheel; it must come from the system"
              exit 1
            fi
          done
          echo "ok: no Vulkan loader bundled"

      - uses: actions/upload-artifact@v6
        with:
          name: manylinux-wheel
          path: wheelhouse/*.whl

  windows:
    name: Windows / MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build and test with MSVC
        # bash, not the Windows default of PowerShell: Actions only checks
        # $LASTEXITCODE after the FINAL line of a pwsh block, so a configure
        # failure followed by anything else would be reported as success. bash
        # runs with -e and fails on the first bad command, like every other job.
        shell: bash
        # Deliberately CPU-only. The runner has no GPU and no Vulkan ICD, so a
        # Vulkan build would compile code nothing could execute; what is
        # genuinely untested here is the COMPILER. MSVC diverges from GCC and
        # Clang enough that this is the most likely source of real findings, and
        # it needs no driver to produce them.
        #
        # Configured directly rather than through a preset: the presets set
        # CMAKE_BUILD_TYPE, which a multi-config generator ignores in favour of
        # --config, and inheriting one here would quietly build the wrong type.
        #
        # BENCHMARKS ON, which is the default and what README.md documents.
        # Turning them off here meant bench/cpp was the one directory MSVC never
        # compiled, and it stayed broken -- harness.h used GCC inline asm, so the
        # plain documented build failed on a clean checkout while CI stayed green
        # (issue #13). A job that passes because it does not compile the target is
        # not covering it, so this now builds what the instructions tell a user to
        # build. It needs no GPU: the failure was a compile error.
        #
        # WERROR ON, matching the Linux C++ job. It could not be adopted while
        # eighteen C4996s fired from std::getenv (issue #23); those now go
        # through one helper in src/util/env.cpp with a scoped suppression, and
        # a full -DVKML_WERROR=ON build of this configuration produces zero
        # warnings. Without this the compiler most likely to find something is
        # the one job allowed to ignore what it finds.
        run: |
          cmake -B build/msvc -DVKML_BUILD_PYTHON=OFF -DVKML_WERROR=ON
          cmake --build build/msvc --config Release --parallel
          ctest --test-dir build/msvc -C Release --output-on-failure

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest nanobind
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build the extension and run the validation suite
        # "Can I build the whole library from scratch and run its tests?" --
        # answered on Windows for the first time. The C++ step above builds with
        # VKML_BUILD_PYTHON=OFF, so until now nothing here had ever produced a
        # .pyd, let alone imported one.
        #
        # This is also what confirms the generator-expression fix in
        # bindings/CMakeLists.txt: a multi-config generator appends the config
        # name to a plain output directory, which would put the extension in
        # python/vkml/Release/ where `import vkml` cannot see it.
        shell: bash
        run: |
          cmake -B build/py -DVKML_BUILD_PYTHON=ON -DVKML_BUILD_TESTS=OFF -DVKML_BUILD_BENCH=OFF
          cmake --build build/py --config Release --parallel
          ls -la python/vkml/
          python -m pytest tests/python -q

      - name: pip install, then use it from outside the source tree
        # The command a user types first, on the platform where it has never
        # run. CPU-only via the escape hatch the README documents -- and which
        # was itself documented and never executed anywhere until now. The
        # runner has no Vulkan driver, so the full install would need an SDK
        # this job does not have.
        shell: bash
        run: |
          pip install --verbose . -C cmake.define.VKML_VULKAN=OFF
          cd "$RUNNER_TEMP"
          python -c "
          import vkml, numpy as np
          assert 'site-packages' in vkml.__file__, vkml.__file__
          print('vkml', vkml.__version__, 'from', vkml.__file__)
          print('vulkan built in:', vkml.has_vulkan)
          a = vkml.tensor(np.ones((8, 8), dtype=np.float32))
          print('cpu matmul sum:', float(vkml.matmul(a, a).numpy().sum()))
          "

      - name: Hardware report
        # Runs against the INSTALLED package, which is the case it exists for.
        # Never fails the job: a Windows machine with no Vulkan driver is a
        # legitimate answer, and this records what it looks like.
        shell: bash
        run: python scripts/hardware_report.py || true
