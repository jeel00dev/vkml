name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap checks first, so an obvious mistake fails in seconds rather than
  # after a full toolchain build.
  static:
    name: Linux / layering + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Layer dependency check
        # Enforces docs/ARCHITECTURE.md 4.1. This has already caught one real
        # violation (autograd reaching into api), so it is not ceremonial.
        run: python scripts/check_layering.py

      - name: clang-format
        run: |
          sudo apt-get update -qq && sudo apt-get install -y clang-format
          find include src tests/cpp bench/cpp bindings -name '*.h' -o -name '*.cpp' \
            | xargs clang-format --dry-run --Werror

  cpp:
    name: Linux / C++ (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: debug
            compiler: g++
          - preset: release
            compiler: g++
          - preset: asan
            compiler: clang++
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build clang
          # The asan preset pins clang because GCC's libasan is not always
          # packaged alongside the compiler.

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DVKML_BUILD_PYTHON=OFF -DVKML_WERROR=ON

      - name: Build
        run: cmake --build build/${{ matrix.preset }} -j$(nproc)

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  python:
    name: Linux / Python + PyTorch validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build

      - name: Install Python dependencies
        # CPU-only torch: the validation suite never needs a GPU, and the CUDA
        # wheels are an order of magnitude larger.
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest nanobind
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build extension
        run: |
          cmake --preset release -DVKML_BUILD_PYTHON=ON
          cmake --build build/release -j$(nproc)

      - name: Run validation suite
        # Coverage is recorded on the same run: it costs nothing measurable and
        # the gate below needs it.
        env:
          VKML_COVERAGE: coverage.tsv
        run: python -m pytest tests/python -q

      - name: Coverage gate
        # Fails when a path the suite used to exercise stops being exercised --
        # invisible in a green run, which is the whole point.
        #
        # The baseline is recorded WITHOUT a GPU, because this runner has none
        # and roughly a third of the strided and large-size coverage comes from
        # the Vulkan tests. The script refuses to compare across a different
        # backend set rather than reporting dozens of phantom gaps.
        run: python scripts/coverage_matrix.py coverage.tsv --check docs/coverage-baseline.json

      - name: Assert the suite is not silently empty
        # A misconfigured import path would make pytest collect nothing and
        # report success, which is the failure mode this guards against.
        run: |
          COUNT=$(python -m pytest tests/python --collect-only -q | tail -1 | grep -oE '^[0-9]+')
          echo "collected $COUNT tests"
          test "$COUNT" -ge 250

  wheel:
    name: Linux / Wheel builds and installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build libvulkan-dev glslang-tools

      - name: Build and install the wheel
        # Exercises a build path nothing else covers: scikit-build-core driving
        # CMake, the install() rule that puts the extension in the wheel, and
        # the version being read out of CMakeLists.txt rather than duplicated.
        run: pip install --verbose .

      - name: Import it from outside the source tree
        # From /tmp, so a passing import cannot be the source directory being
        # picked up instead of the installed package -- which is exactly how a
        # broken wheel looks like a working one.
        run: |
          cd /tmp
          python -c "
          import vkml, os
          assert 'site-packages' in vkml.__file__, vkml.__file__
          print('vkml', vkml.__version__, 'from', os.path.dirname(vkml.__file__))
          print('vulkan built in:', vkml.has_vulkan)
          assert vkml.has_vulkan, 'the wheel should carry the Vulkan backend'
          "

  second-driver:
    name: Linux / Vulkan suite on a second driver (lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install toolchain and a software Vulkan driver
        # mesa-vulkan-drivers ships lavapipe, which needs no GPU. That is the
        # point: the runner has none, and everything else here therefore skips
        # every Vulkan test.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build libvulkan-dev glslang-tools \
                                  mesa-vulkan-drivers vulkan-tools

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest nanobind
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build with the Vulkan backend
        run: |
          cmake --preset release -DVKML_VULKAN=ON -DVKML_BUILD_PYTHON=ON
          cmake --build build/release -j$(nproc)

      - name: Confirm a Vulkan device is visible
        run: vulkaninfo --summary | grep -i -E "deviceName|driverName"

      - name: Run the suite
        # A different DRIVER, which is where portability actually breaks --
        # subgroup 8 against RADV's 64, half the shared memory, and its own
        # SPIR-V compiler. Tests that model RADV's compiler skip themselves.
        run: python -m pytest tests/python -q

  python-asan:
    name: Linux / Python suite under AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install toolchain
        # clang for the sanitizer runtime, llvm for llvm-symbolizer -- without
        # the latter a report still fires but gives offsets instead of names.
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build clang llvm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest nanobind
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run the suite against an instrumented build
        # A separate job rather than a flag on the existing one: the sanitised
        # extension is ~20x larger and the suite takes ~4x as long, and it
        # overwrites python/vkml/, so it cannot share a workspace with the
        # ordinary Python job.
        #
        # This covers the CPU backend and everything above it. Vulkan is absent
        # by default and the runner has no GPU, so those tests skip -- stated
        # rather than implied, because "the suite passed under ASan" would
        # otherwise sound like it covered the shaders.
        run: python scripts/asan_python.py

  benchmark:
    name: Linux / Benchmark smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build

      - name: Build
        run: |
          cmake --preset relwithdebinfo -DVKML_BUILD_PYTHON=OFF
          cmake --build build/relwithdebinfo -j$(nproc)

      - name: Run
        # CI runners are too noisy for the numbers to gate a merge; this only
        # proves the harness still runs and every benchmark completes. Real
        # baselines are recorded in docs/BASELINE-CPU.md from a known machine.
        run: ./build/relwithdebinfo/bin/vkml_bench --json > bench-results.json

      - uses: actions/upload-artifact@v6
        with:
          name: bench-results
          path: bench-results.json

  # -------------------------------------------------------------------------
  # Platforms nothing has ever run vkML on. Both are here to produce evidence,
  # not to defend a property that is already established.
  # -------------------------------------------------------------------------

  macos:
    name: macOS / MoltenVK
    runs-on: macos-15
    # An EXPERIMENT, not yet a gate, and continue-on-error says so honestly.
    # The README lists MoltenVK among the drivers Vulkan reaches, and that claim
    # has never been tested. Two outcomes, two different follow-ups:
    #
    #   MoltenVK provides bufferDeviceAddress, scalarBlockLayout and
    #   timelineSemaphore -> this becomes a real gate, and continue-on-error
    #   comes off in the same commit.
    #
    #   It does not -> vkML cannot run on Apple hardware at all. That belongs in
    #   the README as a stated limit, and this job should be DELETED rather than
    #   left permanently red, because a job nobody expects to pass trains
    #   everyone to ignore the board.
    #
    # Revisit trigger: the first completed run. Do not leave this flag in place
    # once the answer is known.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install MoltenVK and a shader compiler
        # molten-vk is the ICD -- the driver itself. vulkan-loader provides the
        # libvulkan the build links against, and glslang supplies
        # glslangValidator, since Homebrew has no glslc outside shaderc.
        # vulkan-validationlayers is here to answer one open question: whether
        # vkml's timestamp-query usage is valid on this driver. Every other job
        # has run with validation available; this one never had, so the timestamp
        # calls have never been checked against the spec on MoltenVK.
        run: |
          brew install molten-vk vulkan-loader vulkan-headers vulkan-tools glslang \
                       vulkan-validationlayers

      - name: Point the loader at the ICD
        # The loader searches /usr/local/share/vulkan/icd.d, and Homebrew on
        # Apple Silicon installs under /opt/homebrew, so it would otherwise find
        # nothing. The first run of this job proved the point: it looked only in
        # share/, Homebrew puts MoltenVK's manifest in etc/, and the job then
        # reported success having found no device at all.
        #
        # Both are searched now, and the variable is exported ONLY when a file is
        # found -- an empty VK_ICD_FILENAMES suppresses the loader's own defaults
        # rather than falling back to them.
        run: |
          prefix=$(brew --prefix)
          icd=$(find "$prefix/etc/vulkan/icd.d" "$prefix/share/vulkan/icd.d" \
                     -name 'MoltenVK_icd.json' 2>/dev/null | head -1)
          if [ -n "$icd" ]; then
            echo "using ICD: $icd"
            echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          else
            echo "no MoltenVK ICD found; leaving the loader's defaults in place"
            find "$prefix" -name '*icd*.json' 2>/dev/null | head
          fi

      - name: Point the loader at the validation layers
        # Same discovery problem as the ICD, and the same fix: the loader
        # searches /usr/local/share/vulkan, Homebrew installs under
        # /opt/homebrew, and the ICD turned out to live in etc/ rather than
        # share/ -- so both are searched and everything found is printed.
        #
        # Exported only when a manifest is found. An empty VK_LAYER_PATH
        # suppresses the loader's own search instead of falling back to it,
        # which would silently disable the very thing this step is for.
        # `brew --prefix <formula>` is asked directly rather than guessed at.
        # The first attempt searched $(brew --prefix)/share and /etc, missed it --
        # Homebrew keeps these under opt/vulkan-validationlayers rather than
        # linking them into the top-level share -- and the layer then enumerated
        # without being loadable, so every real vkCreateInstance failed with
        # VK_ERROR_LAYER_NOT_PRESENT while the layer-free probe still saw a
        # usable device. The job passed having skipped all 441 Vulkan tests.
        run: |
          # `brew list` is the package's own inventory of what it installed.
          # Every previous attempt here reconstructed a path and got it wrong:
          # share/ instead of etc/ for the ICD, then $(brew --prefix)/share
          # instead of opt/<formula>/share, then a find(1) that could not
          # descend because opt/<formula> is a SYMLINK into the Cellar and find
          # does not follow those in its starting path. Asking costs nothing.
          files=$(brew list vulkan-validationlayers)
          manifest=$(echo "$files" | grep -m1 'VkLayer_khronos_validation\.json$')
          lib=$(echo "$files" | grep -m1 'libVkLayer_khronos_validation\.dylib$')

          if [ -z "$manifest" ] || [ -z "$lib" ]; then
            echo "$files"
            echo "::error::the formula ships no usable validation layer (manifest='$manifest' lib='$lib')"
            exit 1
          fi

          # The manifest names its library as a bare filename, so the loader
          # dlopen()s it against dyld's search path -- which is why the layer
          # loaded its manifest and then failed with
          # "libVkLayer_khronos_validation.dylib (no such file)", turning every
          # vkCreateInstance into VK_ERROR_LAYER_NOT_PRESENT.
          echo "using layer manifest: $manifest"
          echo "using layer library:  $lib"
          echo "VK_LAYER_PATH=$(dirname "$manifest")" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$(dirname "$lib")" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest nanobind torch

      - name: Build with the Vulkan backend
        # New compiler coverage regardless of what MoltenVK turns out to
        # support: nothing has built this with Apple Clang.
        run: |
          cmake --preset release -DVKML_VULKAN=ON -DVKML_BUILD_PYTHON=ON
          cmake --build build/release -j$(sysctl -n hw.ncpu)

      - name: Does anything at all see a device here?
        # An INDEPENDENT oracle, and the discriminator for the previous run's
        # result: vkML saw zero devices with the ICD correctly pointed at
        # MoltenVK, and two very different causes produce that.
        #
        #   vulkaninfo lists a device -> the runner has a GPU and vkML cannot
        #   see it. MoltenVK is a portability driver, and since loader 1.3.216
        #   those are hidden unless the instance opts in with
        #   VK_KHR_portability_enumeration -- which vkml's does not. That would
        #   be a real vkML defect, and the reason the README's MoltenVK claim
        #   is currently unsupportable.
        #
        #   vulkaninfo lists nothing -> the runner VM exposes no Metal device,
        #   this job can never answer the question, and it should be cut back
        #   to a build-only check rather than left failing.
        #
        # Never fails the job: it is here to produce evidence, not a verdict.
        run: vulkaninfo --summary || echo "vulkaninfo failed or found nothing"

      - name: What does MoltenVK actually offer?
        # The question this job exists to answer, and the reason the report
        # queries physical devices only: it prints a verdict even for a device
        # the backend would refuse, which is the outcome worth knowing.
        #
        # --require-device is what makes the answer legible. Without it the first
        # run of this job went green having seen no device at all: the suite
        # passes either way, because every Vulkan test skips itself when nothing
        # is present, and 441 silent skips look exactly like success.
        run: python scripts/hardware_report.py --require-device

      - name: Are our timestamp queries valid on this driver?
        # The discriminator for the one remaining macOS failure. This device
        # reports timestampValidBits != 0 AND timestampPeriod = 1.0 ns, so both
        # capability checks pass, and every dispatch still profiles as 0.000 ms
        # -- which leaves end <= start, i.e. timestamps that never advance.
        #
        # Two explanations remain and they need opposite responses. vkml enables
        # validation by default, so if our use of vkCmdWriteTimestamp,
        # vkCmdResetQueryPool or vkGetQueryPoolResults is wrong, the layer says
        # so here and the fix is ours. If the layer is silent, the timestamps
        # simply do not advance on this GPU -- and note it is an "Apple
        # Paravirtual device", a virtualised GPU, where counter sampling is
        # commonly unavailable. That is a property of this runner, which a
        # single virtualised device cannot generalise into a claim about
        # MoltenVK or Apple hardware at large.
        #
        # ANSWERED, 2026-07-29. With the layer loaded and the portability-subset
        # violation fixed, validation emits NOTHING -- not one message, and none
        # ever about vkCmdWriteTimestamp, the query pool or
        # vkGetQueryPoolResults. The profile comes back with both entries, so the
        # resolve path works; the tick values simply do not advance:
        #
        #     timestamps_supported: True
        #     profile entries: 2
        #       submit: 0.000000 ms
        #       dispatch: 0.000000 ms
        #
        # So vkml's timestamp usage is spec-valid on MoltenVK, and this is a
        # property of an "Apple Paravirtual device" -- a virtualised GPU, where
        # counter sampling is commonly unavailable. It is NOT a statement about
        # MoltenVK or Apple hardware generally; one virtualised device cannot
        # support that claim.
        #
        # The step stays because it is the only thing that would notice if a
        # future runner image, or real hardware, started reporting real numbers.
        # Revisit trigger: any run where the two lines above are non-zero.
        #
        # Never fails the job: it produces evidence, not a verdict.
        run: |
          python - <<'PY' || true
          import sys
          sys.path.insert(0, "python")
          import numpy as np
          import vkml as V

          V.init_vulkan(0)
          print("timestamps_supported:", V.vulkan_timestamps_supported(0))

          V.vulkan_set_profiling(True, 0)
          dev = V.device("vulkan:0")
          rng = np.random.default_rng(0)
          a = V.tensor(rng.random((512, 512), dtype=np.float32), device=dev)
          b = V.tensor(rng.random((512, 512), dtype=np.float32), device=dev)
          V.matmul(a, b).numpy()

          profile = V.vulkan_last_profile(0)
          print("profile entries:", len(profile))
          for label, ms in profile:
              print(f"  {label}: {ms:.6f} ms")
          PY

      - name: Run the suite
        run: python -m pytest tests/python -q

  manylinux:
    name: Linux / redistributable wheel (manylinux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build a manylinux wheel
        # The ordinary wheel job builds a linux_x86_64 wheel, which PyPI
        # rejects. This one builds what could actually be published. All of the
        # configuration lives in pyproject.toml under [tool.cibuildwheel] and
        # was verified locally in the manylinux image first.
        #
        # One Python here rather than the declared four: the glslang source
        # build dominates, and a push does not need to prove all four when the
        # only difference is the interpreter. A release run drops the override.
        env:
          CIBW_BUILD: cp312-*
        run: pipx run cibuildwheel==2.21.3 --output-dir wheelhouse

      - name: Check the tag, and that no Vulkan loader was bundled
        # Two things make this wheel correct rather than merely present: a
        # manylinux tag PyPI will accept, and the ABSENCE of libvulkan.so.1
        # inside it. Bundling the loader would ship one frozen at build time
        # that cannot see the user's driver.
        run: |
          ls -la wheelhouse/
          for w in wheelhouse/*.whl; do
            case "$w" in
              *manylinux*) echo "ok: manylinux tag -- $(basename "$w")" ;;
              *) echo "::error::not a manylinux wheel: $(basename "$w")"; exit 1 ;;
            esac
            if python -m zipfile -l "$w" | grep -q "libvulkan"; then
              echo "::error::libvulkan is bundled inside the wheel; it must come from the system"
              exit 1
            fi
          done
          echo "ok: no Vulkan loader bundled"

      - uses: actions/upload-artifact@v6
        with:
          name: manylinux-wheel
          path: wheelhouse/*.whl

  windows:
    name: Windows / MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build and test with MSVC
        # bash, not the Windows default of PowerShell: Actions only checks
        # $LASTEXITCODE after the FINAL line of a pwsh block, so a configure
        # failure followed by anything else would be reported as success. bash
        # runs with -e and fails on the first bad command, like every other job.
        shell: bash
        # Deliberately CPU-only. The runner has no GPU and no Vulkan ICD, so a
        # Vulkan build would compile code nothing could execute; what is
        # genuinely untested here is the COMPILER. MSVC diverges from GCC and
        # Clang enough that this is the most likely source of real findings, and
        # it needs no driver to produce them.
        #
        # Configured directly rather than through a preset: the presets set
        # CMAKE_BUILD_TYPE, which a multi-config generator ignores in favour of
        # --config, and inheriting one here would quietly build the wrong type.
        run: |
          cmake -B build/msvc -DVKML_BUILD_PYTHON=OFF -DVKML_BUILD_BENCH=OFF
          cmake --build build/msvc --config Release --parallel
          ctest --test-dir build/msvc -C Release --output-on-failure
