name: Documentation site

# WHY THIS EXISTS. `web/build.py` produced a complete static site that was only
# ever written to a local `web/_site` and published nowhere. The repository's
# About link and `SITE_URL` in web/build.py both named
# https://jeel00dev.github.io/vkml, and nothing served it — a documented address
# for a site that had never been deployed.
#
# Separate from ci.yml deliberately. The documentation GATES belong on every
# push because they guard correctness; DEPLOYING belongs only on main, and a
# failed deploy must not be able to mark a correct commit red.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the deploy needs Pages and an OIDC token, nothing else. It
# must not be able to write to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and do NOT cancel one in flight: a half-finished Pages
# deployment leaves the live site in an unknown state, which is worse than
# waiting for a superseded build to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # VULKAN ON, though this runner has no GPU. web/build.py imports the real
      # module to derive the reference, and its own gate rejected a CPU-only
      # build with "listed but absent from the module: init_vulkan,
      # vulkan_capabilities, ..." — the site documents the Vulkan surface, so a
      # build without it produces an incomplete reference. Compiling needs only
      # the loader and headers; nothing here executes a shader.
      - name: Install the Vulkan toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan-dev glslang-tools

      - name: Build vkml and install
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy nanobind scikit-build-core pillow
          # EDITABLE, and that is not a stylistic choice. web/build.py puts the
          # source tree's python/ on sys.path, so python/vkml/__init__.py
          # shadows any site-packages copy and then fails to find _vkml_core,
          # which a plain `pip install .` never writes there. The first deploy
          # failed exactly this way. An editable install makes the two paths
          # resolve to one extension -- the same reason CLAUDE.md warns that a
          # rebuild is not necessarily what `import vkml` gives you (#113).
          pip install --verbose -e . -C cmake.define.VKML_VULKAN=ON

      - name: Build the site
        run: python web/build.py

      # The gates that validate the BUILT SITE. Publishing a site that fails
      # them would put the deploy ahead of the project's own discipline.
      #
      # check_docs_references.py is deliberately NOT here. It also validates
      # citations in the design documents into third_party/reference -- llama.cpp,
      # CUTLASS, Tensile, tinygrad -- which are vendored locally and not checked
      # out on a runner, so it reports twelve absent files that are present in a
      # full tree. That gate belongs to ci.yml, which owns the source tree's
      # correctness; this workflow owns the site.
      - name: Documentation gates
        run: |
          python scripts/check_docs_links.py
          python scripts/docs_graph.py --check
          python scripts/check_source_links.py
          python scripts/check_design_system.py
          # Moved from ci.yml, which ran them against a site built from a
          # CPU-only module -- web/build.py cannot do that, so the step died
          # before any of these ran. They need the site AND numpy, and this is
          # the job that has both.
          python scripts/check_css_bindings.py
          python scripts/check_docs_references.py
          # The dashboard breaks each gate on purpose and checks it goes red.
          # Two of its controls damage a page in web/_site, so it needs the
          # site too.
          python scripts/verify_gates.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
