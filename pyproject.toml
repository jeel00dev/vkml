# Packaging, so that `pip install .` produces a usable vkML.
#
# Until this existed the only way to use the library was to clone it, run CMake
# by hand and put python/ on sys.path -- which is what examples/mnist does, with
# a comment saying it would be dropped once there was a real install step.
#
# scikit-build-core drives the existing CMake build rather than reimplementing
# it, so there is one build system and not two. It is also what nanobind's own
# documentation recommends for exactly this shape of project.
#
# The SPIR-V is compiled into the extension by cmake/EmbedSpirv.cmake, so the
# wheel has no data files to locate at run time: one .so and the Python package
# beside it.

[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "vkml"
description = "Vulkan-native deep learning framework"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jeel Thesiya" }]
keywords = ["vulkan", "gpu", "machine-learning", "deep-learning", "tensor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# numpy is not optional: every tensor crosses the boundary as an ndarray, and
# `import vkml` fails without it.
dependencies = ["numpy>=1.24"]

# Read from CMakeLists.txt rather than written twice. Two copies of a version
# number disagree the first time someone bumps one of them.
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/jeel00dev/vkml"
Source = "https://github.com/jeel00dev/vkml"
Issues = "https://github.com/jeel00dev/vkml/issues"

[tool.scikit-build]
minimum-version = "0.10"
# Keyed by interpreter, NOT a bare "build/wheel". The same checkout gets built
# by the host (CPython 3.14, CMake 4.2) and by the CI container (CPython 3.12,
# CMake 3.28), and a single shared directory hands the second builder the
# first one's CMakeCache. Two CMake version directories were found sitting side
# by side in one such tree.
#
# Sharing it is not merely wasteful, it is unrecoverable without knowing to
# delete the directory. A configure that fails partway caches what it managed
# to detect, and CMake trusts the cache on the next run: after one interrupted
# build, `CMAKE_EXECUTABLE_FORMAT` was cached as `Unknown` instead of `ELF`,
# and every later `pip install -e .` failed with
#
#     The install of the _vkml_core target requires changing an RPATH from the
#     build tree, but this is not supported with the Ninja generator unless on
#     an ELF-based or XCOFF-based platform.
#
# on a platform that is ELF-based. The message names RPATH, Ninja and the
# generator, and nothing that would lead you to a stale cache entry.
#
# `cache_tag` is `sys.implementation.cache_tag` -- cpython-314 here,
# cpython-312 in the container -- so the two builders can no longer collide.
build-dir = "build/wheel/{cache_tag}"
wheel.packages = ["python/vkml"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = '''(?sm)^project\(.*?VERSION\s+(?P<value>[0-9]+\.[0-9]+\.[0-9]+)'''

[tool.scikit-build.cmake.define]
# The whole point of the library. A CPU-only wheel would install without
# complaint and then be the wrong thing, so this is ON and the build fails
# loudly when the Vulkan SDK is absent -- `find_package(Vulkan REQUIRED)`.
# Build without it deliberately if you must:
#
#     pip install . -C cmake.define.VKML_VULKAN=OFF
#
VKML_VULKAN = "ON"

# Nothing a wheel ships needs these, and they are most of the build time.
VKML_BUILD_TESTS = "OFF"
VKML_BUILD_BENCH = "OFF"
VKML_BUILD_PYTHON = "ON"

# ---------------------------------------------------------------------------
# Redistributable wheels
#
# `pip wheel .` produces a linux_x86_64 wheel, which PyPI REJECTS: that tag
# promises nothing about the glibc it was built against. A publishable Linux
# wheel has to be built inside a manylinux image and relabelled by auditwheel.
#
# Every step below was run locally in quay.io/pypa/manylinux_2_28_x86_64 before
# being written down, because two things about that image are not obvious:
#
#   it has vulkan-headers and vulkan-loader-devel, but NO GLSL compiler at all,
#   so glslang is built from source -- ENABLE_OPT=OFF to avoid dragging in
#   SPIRV-Tools, which is why shaders/CMakeLists.txt now probes for -Os instead
#   of assuming it;
#
#   auditwheel would otherwise BUNDLE libvulkan.so.1 into the wheel, and that is
#   actively wrong. The Vulkan loader is the component that finds the user's
#   driver; a copy frozen at build time would not see it. It is excluded so the
#   extension keeps resolving the system loader -- verified with ldd inside the
#   repaired wheel.
#
# The consequence for users is a real runtime dependency the wheel cannot state
# in metadata: libvulkan.so.1 must exist or `import vkml` fails. The README says
# so under Installation.
# ---------------------------------------------------------------------------
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
# musllinux and aarch64 are unverified; claiming them without a build that ran
# would be the sort of promise this project does not make.
skip = "*-musllinux*"
archs = "x86_64"
build-frontend = "build"
test-command = "python -c \"import vkml, numpy as np; print(vkml.__version__, vkml.matmul(vkml.tensor(np.ones((8,8),dtype=np.float32)), vkml.tensor(np.ones((8,8),dtype=np.float32))).numpy().sum())\""

[tool.cibuildwheel.linux]
# Pinned, not defaulted. The recipe below was verified in this exact image, and
# cibuildwheel's default has been manylinux2014 -- CentOS 7, which has yum and
# no dnf, so the first CI run failed on `dnf: command not found` while the same
# steps worked locally. The image is part of the recipe, not a detail.
manylinux-x86_64-image = "manylinux_2_28"

before-all = """
dnf -y install epel-release
dnf -y install vulkan-headers vulkan-loader-devel vulkan-loader
curl -sL https://github.com/KhronosGroup/glslang/archive/refs/tags/16.4.0.tar.gz | tar xz -C /tmp
cmake -S /tmp/glslang-16.4.0 -B /tmp/glslang-build -DCMAKE_BUILD_TYPE=Release \
      -DENABLE_OPT=OFF -DGLSLANG_TESTS=OFF -DCMAKE_INSTALL_PREFIX=/usr/local
cmake --build /tmp/glslang-build -j4 --target install
"""
repair-wheel-command = "auditwheel repair --exclude libvulkan.so.1 -w {dest_dir} {wheel}"
